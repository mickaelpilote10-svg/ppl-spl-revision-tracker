*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",system-ui,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 16px 48px}.hero{padding:24px clamp(17px,4vw,34px);margin-bottom:16px;border-radius:16px;background:linear-gradient(135deg,#123d62,#1f5f99 62%,#2e7d91);color:#fff}.hero h1{font:800 clamp(1.7rem,4vw,2.5rem)/1.1 Georgia,serif;margin:0}.hero p{margin:9px 0 0;color:#e0edf7}.eyebrow{letter-spacing:.12em;text-transform:uppercase;font-weight:700;font-size:.8rem;color:#c8e2f7;margin:0 0 8px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.btn,.tab,.lesson-btn,.choice{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 13px;cursor:pointer}.btn:hover,.tab:hover,.lesson-btn:hover,.choice:hover{border-color:var(--accent)}.btn.primary,.tab[aria-current=true]{background:var(--accent);color:#fff;border-color:var(--accent)}.btn:disabled{opacity:.5;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.panel,.course-card,.lesson-card,.question{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 12px}.panel h2,.course-card h2,.lesson-card h2{font:700 1.25rem Georgia,serif;margin:0 0 9px}.muted,.hint{color:var(--muted)}.hint{font-size:.92rem}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:9px;margin:12px 0}.kpi{padding:12px;border-radius:10px;background:var(--soft)}.kpi b{display:block;font-size:1.45rem;color:var(--accent)}.kpi span{font-size:.86rem;color:var(--muted)}.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}.meter span{display:block;height:100%;background:var(--accent);transition:width .2s}.small{font-size:.88rem}.tag{color:var(--accent);font-weight:700;font-size:.82rem}.list{display:grid;gap:8px}.lesson-btn{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;gap:10px}.lesson-btn .name{font-weight:700}.status{font-size:.8rem;color:var(--muted);white-space:nowrap}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tab{font-size:.92rem}.lesson-grid{display:grid;grid-template-columns:minmax(200px,270px) 1fr;gap:14px}.lesson-nav{align-self:start;position:sticky;top:8px}.lesson-card ul{padding-left:20px;margin:7px 0}.lesson-card li{margin:5px 0}.definition{border-left:4px solid var(--accent);background:var(--soft);border-radius:6px;padding:10px 12px;margin:8px 0}.callout{border-left:4px solid var(--warm);background:color-mix(in srgb,var(--warm) 12%,var(--surface));border-radius:7px;padding:10px 12px;margin:10px 0}.question h3{font:700 1.12rem Georgia,serif;margin:0 0 12px}.choices{display:grid;gap:8px}.choice{text-align:left}.choice.selected{outline:2px solid var(--accent)}.feedback{border-radius:8px;padding:11px 13px;margin-top:12px}.feedback.good{border-left:4px solid var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}.feedback.bad{border-left:4px solid var(--err);background:color-mix(in srgb,var(--err) 12%,var(--surface))}textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--ink);font:inherit}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}.source{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.due{color:var(--warm);font-weight:700}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:.8rem;margin:2px}.error-row{border-left:4px solid var(--err);padding:9px 11px;background:color-mix(in srgb,var(--err) 9%,var(--surface));margin:6px 0;border-radius:6px}#coach [hidden]{display:none!important}@media(max-width:720px){.lesson-grid{grid-template-columns:1fr}.lesson-nav{position:static}.two-col{grid-template-columns:1fr}.wrap{padding:12px 10px <header class="hero"><p class="eyebrow">PPL Tracker Revision · entraînement actif</p><h1>Coach de théorie</h1><p>Comprends une leçon, ferme le cours, retrouve les notions de mémoire, entraîne-toi, puis reviens au bon moment.</p></header>

<script>
const URLP=new URLSearchParams(location.search),USER=URLP.get('uid')||'local',KEY='ppl-coach-v1:'+USER,DELAYS=[1,3,7,14,30];
const lessons={
'050':[
{id:'pressure',title:'01 · Pression et altitude',blocks:[['Pression et altitude','La pression correspond au poids de la colonne d’air au-dessus d’un point. Elle diminue avec l’altitude et l’air devient moins dense. Au niveau moyen de la mer, le repère moyen du cours est 1013,25 hPa.'],['Réglages altimétriques','QNH : altitude par rapport au niveau moyen de la mer. QFE : hauteur au-dessus de l’aérodrome. QFF : pression réduite au niveau de la mer selon les conditions locales, utilisée pour comparer la météo.'],['Cartes','Isobares : mêmes pressions. Isohypses : mêmes altitudes sur une surface de pression donnée. H indique une haute pression, B une basse pression.']],recall:{q:'Sans regarder le cours, explique la baisse de pression avec l’altitude et distingue QNH, QFE et QFF.',ref:'La pression baisse quand l’altitude augmente. QNH donne l’altitude au-dessus du niveau moyen de la mer ; QFE la hauteur au-dessus de l’aérodrome ; QFF la pression ramenée au niveau de la mer selon les conditions locales.',groups:[['pression','baisse','diminue'],['altitude','monte','augmente'],['qnh'],['niveau moyen de la mer','altitude mer'],['qfe'],['hauteur','aerodrome'],['qff'],['conditions locales','meteo']]},qcm:{q:'Quel réglage indique la hauteur au-dessus de l’aérodrome ?',o:['QNH','QFE','QFF','1013,25 hPa'],a:1,e:'Le QFE est la pression locale à l’altitude de la station ; réglé à l’altimètre, il indique la hauteur au-dessus de l’aérodrome.'},tf:{q:'Sur une carte, les isobares relient les points de même altitude.',a:false,e:'C’est l’inverse : les isobares relient les mêmes pressions ; les isohypses relient les mêmes altitudes sur une surface isobare.'},exam:{q:'Un altimètre est réglé au QNH. Quel repère d’altitude cherche-t-on à lire ?',o:['La hauteur au-dessus de l’aérodrome','L’altitude par rapport au niveau moyen de la mer','La pression locale uniquement','L’altitude de la surface 500 hPa'],a:1,e:'Le QNH sert à lire l’altitude par rapport au niveau moyen de la mer.'},open:{q:'Explique avec tes mots la différence entre QNH, QFE et QFF.',ref:'QNH : altitude au-dessus du niveau moyen de la mer. QFE : hauteur au-dessus de l’aérodrome. QFF : pression météo ramenée au niveau de la mer.',groups:[['qnh'],['altitude','niveau moyen de la mer'],['qfe'],['hauteur','aerodrome'],['qff'],['pression','niveau de la mer','meteo']] }},
{id:'wind',title:'02 · Vent',blocks:[['Direction et vitesse','Le vent est nommé selon la direction d’où il vient. La girouette indique la direction ; l’anémomètre mesure la vitesse. 1 kt ≈ 1,85 km/h.'],['Barbules','Petite barbule : 5 kt. Grande barbule : 10 kt. Triangle plein : 50 kt. On additionne les symboles.'],['Circulation et vents locaux','Au sol, l’air va des hautes vers les basses pressions. Dans l’hémisphère Nord, la rotation terrestre dévie le vent vers la droite. Les frottements près du sol le ralentissent et réduisent sa déviation. Jour : brise de mer et vent de vallée. Nuit : brise de terre et vent de montagne.']],recall:{q:'Rappelle comment le vent est nommé, comment lire les barbules et les brises de jour/nuit.',ref:'Le vent est nommé d’après sa provenance. Petite barbule 5 kt, grande 10 kt, triangle 50 kt. Le jour, brise de mer et vent de vallée ; la nuit, brise de terre et vent de montagne.',groups:[['vient','provient','direction'],['petite','5 kt','5 noeuds'],['grande','10 kt'],['triangle','50 kt'],['jour'],['brise de mer'],['vent de vallee'],['nuit'],['brise de terre'],['vent de montagne']]},qcm:{q:'Quelle vitesse correspond au triangle plein sur une barbule selon la fiche ?',o:['5 kt','10 kt','25 kt','50 kt'],a:3,e:'Le triangle plein représente 50 kt ; petite barbule 5 kt et grande barbule 10 kt.'},tf:{q:'Une brise de mer souffle de la mer vers la terre le jour.',a:true,e:'Le jour, la terre chauffe plus vite que la mer ; le vent de surface souffle de la mer vers la terre.'},exam:{q:'Une carte montre une barbule avec un triangle plein et une petite barbule. Quelle vitesse cela représente ?',o:['15 kt','45 kt','55 kt','60 kt'],a:2,e:'On additionne les symboles : 50 kt + 5 kt = 55 kt.'},open:{q:'Explique pourquoi les frottements modifient le vent près du sol.',ref:'Près du sol, les frottements ralentissent le vent et réduisent sa déviation. Ils sont généralement plus faibles sur mer que sur terre.',groups:[['frottement'],['ralentit','vitesse diminue'],['deviation','rotation'],['sol','surface']] }},
{id:'thermo',title:'03 · Thermodynamique',blocks:[['Humidité','L’humidité relative compare la vapeur d’eau présente au maximum possible à cette température. À 100 %, l’air est saturé. Si l’air se réchauffe sans ajout de vapeur, l’humidité relative diminue.'],['Point de rosée et condensation','Le point de rosée est la température à laquelle l’air devient saturé en se refroidissant ; la condensation peut alors commencer. La chaleur latente est absorbée ou libérée lors d’un changement d’état sans variation de température.'],['Mouvements verticaux','Une parcelle qui monte se détend et se refroidit ; qui descend, elle se comprime et se réchauffe. Repères du cours : air sec ≈ 1 °C/100 m ; air humide ≈ 0,6 °C/100 m.']],recall:{q:'Explique le point de rosée et ce qui arrive à une parcelle d’air qui monte.',ref:'Le point de rosée est la température où l’air devient saturé en refroidissant et où la condensation peut commencer. En montant, l’air se détend et se refroidit. Repères du cours : sec 1 °C/100 m, humide 0,6 °C/100 m.',groups:[['point de rosee','temperature'],['sature','saturation'],['refroidit','refroidissement'],['condensation'],['monte','ascend'],['detend','detente'],['1 °c','100 m','air sec'],['0 6 °c','0.6 °c','air humide']]},qcm:{q:'À quantité de vapeur d’eau inchangée, que devient l’humidité relative si l’air se réchauffe ?',o:['Elle augmente','Elle diminue','Elle reste toujours à 100 %','Elle devient la pression'],a:1,e:'Un air plus chaud peut contenir davantage de vapeur ; si la quantité réelle ne change pas, l’humidité relative diminue.'},tf:{q:'Une transformation adiabatique se fait sans échange de chaleur avec l’extérieur.',a:true,e:'C’est la définition donnée dans la fiche.'},exam:{q:'Une parcelle d’air descend sans échange de chaleur avec l’extérieur. Quel changement est décrit ?',o:['Elle se détend et se refroidit','Elle se comprime et se réchauffe','Elle se condense forcément','Sa pression diminue'],a:1,e:'En descendant, la pression augmente : la parcelle se comprime et se réchauffe.'},open:{q:'Compare les repères de refroidissement de l’air sec et de l’air humide donnés dans la fiche.',ref:'Le repère de refroidissement est d’environ 1 °C par 100 m pour l’air sec et 0,6 °C par 100 m pour l’air humide.',groups:[['air sec'],['1 °c','un degre'],['100 m'],['air humide'],['0 6 °c','0.6 °c','zero virgule six'],['100 m']] }},
{id:'clouds',title:'04 · Nuages',blocks:[['Formation','Un nuage se forme lorsque l’air humide se refroidit jusqu’à saturation. La vapeur se condense sur des noyaux de condensation pour former des gouttelettes ou des cristaux.'],['Familles','Cirrus, cirrostratus, cirrocumulus : étage supérieur. Altostratus et altocumulus : moyen. Stratus, stratocumulus et nimbostratus : inférieur. Cumulus et cumulonimbus : développement vertical ; averses ou orages possibles avec le Cb.'],['Couverture en octas','FEW 1–2/8 ; SCT 3–4/8 ; BKN 5–7/8 ; OVC 8/8. Stratiformes : étendus horizontalement, précipitations souvent faibles à continues. Cumuliformes : développement vertical, averses/orages possibles.']],recall:{q:'Décris la chaîne qui forme un nuage et les codes de couverture FEW à OVC.',ref:'L’air humide monte ou se refroidit, se détend, atteint la saturation et la vapeur se condense sur des noyaux en gouttelettes ou cristaux. FEW 1–2/8, SCT 3–4/8, BKN 5–7/8, OVC 8/8.',groups:[['air humide','vapeur'],['refroidit','refroidissement'],['saturation','sature'],['condensation','condense'],['noyaux'],['few','1 2','1/8'],['sct','3 4','3/8'],['bkn','5 7','5/8'],['ovc','8/8','totalement couvert']]},qcm:{q:'Quel code indique un ciel totalement couvert dans les repères de la fiche ?',o:['FEW','SCT','BKN','OVC'],a:3,e:'OVC correspond à 8/8, ciel totalement couvert.'},tf:{q:'Les noyaux de condensation sont de minuscules particules sur lesquelles la vapeur d’eau peut se condenser.',a:true,e:'Poussières et aérosols peuvent servir de noyaux de condensation.'},exam:{q:'Un METAR indique BKN. Quelle couverture nuageuse correspond au repère de cours ?',o:['1–2 octas','3–4 octas','5–7 octas','8 octas exactement'],a:2,e:'BKN correspond à 5 à 7 octas selon la fiche.'},open:{q:'Quelle différence essentielle la fiche fait-elle entre nuages stratiformes et cumuliformes ?',ref:'Les stratiformes s’étendent horizontalement et peuvent donner des précipitations continues. Les cumuliformes se développent verticalement ; averses et orages sont possibles.',groups:[['stratiforme','stratiformes'],['horizontal','etendu'],['cumuliforme','cumuliformes'],['vertical'],['averse','orage']] }},
{id:'fronts',title:'05 · Masses d’air, stabilité et fronts',blocks:[['Masses d’air','A/P/T/E indiquent l’origine thermique : arctique, polaire, tropicale, équatoriale. c = continental plutôt sec ; m = maritime plutôt humide. Exemple : mP, polaire maritime, froid et humide.'],['Stabilité','Sol froid sous air chaud : stabilité accrue. Sol chaud sous air froid : instabilité et convection possibles.'],['Perturbations','Une perturbation comprend une dépression, un front chaud et un front froid ; déplacement généralement d’ouest en est, durée indiquée de 3 à 10 jours. Le front froid peut rattraper le front chaud et former une occlusion. Le jet-stream guide souvent les perturbations vers l’est.'],['Fronts','Front chaud : pente faible, air chaud soulevé lentement, nuages étendus et précipitations souvent continues. Front froid : pente forte, soulèvement rapide, averses ou orages possibles selon la stabilité.']],recall:{q:'Explique les codes c/m et la différence de pente entre front chaud et front froid.',ref:'c signifie continental, plutôt sec ; m maritime, plutôt humide. Front chaud : pente faible et soulèvement lent. Front froid : pente forte et soulèvement rapide.',groups:[['continental','c'],['sec'],['maritime','m'],['humide'],['front chaud'],['pente faible','faible'],['lent','progressif'],['front froid'],['pente forte','forte'],['rapide']]},qcm:{q:'Que signifie le m dans le code de masse d’air mP ?',o:['Masse moyenne','Maritime, plutôt humide','Mouvement vers l’est','Masse très froide'],a:1,e:'m indique maritime et plutôt humide ; P indique polaire et froid.'},tf:{q:'Un front chaud est associé à une pente plus forte que celle d’un front froid.',a:false,e:'Dans la fiche, le front chaud a une pente faible ; le front froid une pente plus forte.'},exam:{q:'Un pilote observe l’approche d’un front chaud décrit dans le cours. Quel changement nuageux est le plus cohérent avec la fiche ?',o:['Zone nuageuse étendue, dégradation progressive','Aucun nuage possible','Uniquement cumulus isolés et ciel toujours stable','La perturbation s’arrête immédiatement'],a:0,e:'Le front chaud est associé à une pente faible, un soulèvement progressif et une zone nuageuse étendue.'},open:{q:'Compare le mouvement vertical de l’air dans un front chaud et un front froid.',ref:'Au front chaud, l’air chaud monte progressivement au-dessus de l’air froid, sur une pente faible. Au front froid, il est soulevé rapidement sur une pente forte.',groups:[['front chaud'],['progressif','lent'],['pente faible'],['front froid'],['rapide'],['pente forte']] }},
{id:'phenomena',title:'06 · Occlusions et phénomènes météo',blocks:[['Occlusion','Elle se forme quand le front froid rattrape le front chaud. Dans l’occlusion à caractère froid, le front froid reste intact sur la carte ; à caractère chaud, le front chaud reste intact.'],['Foehn du sud','L’air monte sur le versant sud des Alpes, se détend et se refroidit. En redescendant au nord, il se comprime et se réchauffe. Le foehn peut apporter vents forts, turbulences, ascendances et descendances ; ciel dégagé ne signifie pas air calme.'],['Autres situations','Goutte froide : poche d’air froid isolée en altitude. Anticyclone dynamique : subsidence. Anticyclone thermique : air froid dense favorisant une pression élevée.']],recall:{q:'Explique la formation de l’occlusion et l’enchaînement du foehn du sud.',ref:'Le front froid rattrape le front chaud et forme une occlusion. Dans le foehn du sud, l’air monte et se refroidit sur le versant sud des Alpes, puis descend, se comprime et se réchauffe au nord ; turbulences possibles.',groups:[['front froid'],['rattrape','rejoint'],['front chaud'],['occlusion'],['monte','ascend'],['versant sud','sud des alpes'],['refroidit'],['descend'],['comprimes','se comprime'],['rechauffe'],['turbulence','vent fort']]},qcm:{q:'Quel front reste intact sur la carte dans une occlusion à caractère de front chaud ?',o:['Le front froid','Le front chaud','Les deux disparaissent toujours','Aucun'],a:1,e:'Repère de la fiche : chaud intact = occlusion à caractère chaud.'},tf:{q:'Un ciel dégagé sous foehn garantit l’absence de turbulence.',a:false,e:'La fiche insiste sur l’inverse : le foehn peut s’accompagner de vents forts et de turbulences même si le ciel est dégagé.'},exam:{q:'Dans le foehn du sud décrit dans le cours, que fait l’air lorsqu’il redescend au nord des Alpes ?',o:['Il se détend et se refroidit','Il se comprime et se réchauffe','Il devient nécessairement saturé','Il s’immobilise'],a:1,e:'En descendant, l’air se comprime et se réchauffe.'},open:{q:'Pourquoi la fiche conseille-t-elle de rester prudent sous un ciel dégagé de foehn ?',ref:'Le foehn peut entraîner des vents forts, turbulences et fortes ascendances ou descendances. Un ciel dégagé ne signifie pas que l’air est calme.',groups:[['foehn'],['vent fort','vents forts'],['turbulence'],['ascendance','montee'],['descendance','descente'],['ciel degage'],['pas calme','ne signifie pas']]}}
],
'010':[{"id":"international","title":"01 · Droit international et droit suisse","blocks":[["Convention de Chicago","La Convention de Chicago du 7 décembre 1944 pose les principes de l’aviation civile internationale. Les États exercent une souveraineté pleine et exclusive sur l’espace aérien au-dessus de leur territoire. Elle distingue les aéronefs civils des aéronefs d’État."],["Organisations","L’OACI harmonise l’aviation civile mondiale et publie des normes et pratiques recommandées dans 19 annexes. L’EASA établit le cadre européen de sécurité aérienne. L’OFAC est l’autorité suisse de l’aviation civile."],["Cadre suisse","Le support présente la loi fédérale sur l’aviation et les ordonnances suisses, ainsi que l’application de règlements européens dans le domaine aéronautique."]],"recall":{"q":"Explique le principe de souveraineté aérienne et distingue les rôles de l’OACI, de l’EASA et de l’OFAC.","ref":"La Convention de Chicago (7 décembre 1944) reconnaît la souveraineté pleine et exclusive des États sur leur espace aérien. L’OACI harmonise l’aviation civile mondiale, l’EASA agit au niveau européen et l’OFAC est l’autorité suisse.","groups":[["Chicago","1944"],["souveraineté"],["espace aérien"],["OACI"],["mondiale","internationale"],["EASA","européenne"],["OFAC","suisse"]]},"qcm":{"q":"Quelle convention fonde les principes de l’aviation civile internationale ?","o":["Varsovie 1929","Chicago 1944","Montréal 1999","Genève 1948"],"a":1,"e":"Le support cite la Convention de Chicago du 7 décembre 1944."},"tf":{"q":"La Convention de Chicago reconnaît la souveraineté des États sur leur espace aérien.","a":true,"e":"La souveraineté est pleine et exclusive au-dessus du territoire de chaque État."},"exam":{"q":"Quel organisme est l’autorité nationale suisse de l’aviation civile ?","o":["OACI","EASA","OFAC","FAA"],"a":2,"e":"L’OFAC est l’autorité suisse de l’aviation civile."},"open":{"q":"Combien d’annexes à la Convention de Chicago sont mentionnées pour les normes et pratiques recommandées ?","o":["8","12","19","32"],"a":2,"e":"Le support indique 19 annexes."}},{"id":"airworthiness","title":"02 · Navigabilité et documents de bord","blocks":[["Navigabilité continue","La navigabilité repose sur l’entretien, la correction des défauts, les inspections programmées, les consignes de navigabilité et les réparations. Le programme d’entretien est propre à chaque aéronef."],["Documents et organismes","Le support cite notamment l’EASA Form 1, les déclarations de conformité, les pesées, les mécaniciens LMA Part-66 et les organismes de maintenance agréés."],["Documents à bord","Selon le support : certificat d’immatriculation, certificat de navigabilité, ARC, certificat acoustique, assurance, licence de station radio si nécessaire, manuel de vol, carnet de route, check-list, fiche de pesée, licence du pilote, médical valide et pièce d’identité."]],"recall":{"q":"Cite les grandes obligations de navigabilité continue et les principaux documents à emporter à bord.","ref":"Entretien, correction des défauts, inspections, consignes de navigabilité et réparations. Documents : immatriculation, navigabilité, ARC, bruit, assurance, licence radio si nécessaire, manuel de vol, carnet de route, check-list, pesée, licence, médical et identité.","groups":[["entretien"],["défauts","correction"],["inspection"],["consigne de navigabilité","AD"],["certificat d’immatriculation"],["navigabilité"],["ARC"],["assurance"],["manuel de vol"],["carnet de route"],["licence pilote"],["médical"]]},"qcm":{"q":"Quel document atteste l’examen de navigabilité en cours ?","o":["ARC","NOTAM","AIC","MEL"],"a":0,"e":"Le support cite l’Airworthiness Review Certificate (ARC)."},"tf":{"q":"Le programme d’entretien est identique pour tous les aéronefs d’un même type.","a":false,"e":"Le support indique un programme d’entretien propre à chaque aéronef."},"exam":{"q":"Quel document doit être à bord dans sa dernière version et correspondre au numéro de série de l’aéronef ?","o":["Manuel de vol","AIP","NOTAM","Licence radio"],"a":0,"e":"Le manuel de vol doit être à jour et correspondre à l’aéronef."},"open":{"q":"Quels documents personnels du pilote sont cités parmi les documents à bord ?","ref":"Licence de pilote, certificat médical valide et pièce d’identité.","groups":[["licence"],["médical"],["identité"]]}},{"id":"registration","title":"03 · Nationalité et immatriculation des aéronefs","blocks":[["Marques","Les marques de nationalité et d’immatriculation suivent les principes de l’Annexe 7 de la Convention de Chicago. Elles permettent d’identifier l’État d’immatriculation et l’aéronef."],["Exemples","Le support cite HB pour la Suisse, D pour l’Allemagne et F pour la France. Les caractères qui suivent sont attribués par l’État. En France, un identifiant commençant par une lettre est précédé d’un trait d’union."],["Registre suisse","Le registre des aéronefs suisses est tenu par l’OFAC."]],"recall":{"q":"Explique comment les marques d’un aéronef permettent d’identifier sa nationalité et son immatriculation.","ref":"Les marques suivent l’Annexe 7. HB identifie la Suisse, D l’Allemagne et F la France ; l’État attribue ensuite l’identifiant. Le registre suisse est tenu par l’OFAC.","groups":[["annexe 7"],["HB","suisse"],["D","allemagne"],["F","france"],["OFAC","registre"]]},"qcm":{"q":"Quel préfixe de nationalité est utilisé pour les aéronefs immatriculés en Suisse ?","o":["F","D","HB","LS"],"a":2,"e":"Le préfixe suisse est HB."},"tf":{"q":"Le registre suisse des aéronefs est tenu par l’OFAC.","a":true,"e":"Le support attribue cette fonction à l’OFAC."},"exam":{"q":"Quel préfixe correspond à la France dans les exemples du support ?","o":["HB","D","F","LS"],"a":2,"e":"Le préfixe français cité est F."},"open":{"q":"À quoi servent les marques de nationalité et d’immatriculation ?","ref":"Elles identifient l’État d’immatriculation et l’aéronef.","groups":[["identifier","identification"],["état"],["immatriculation","aéronef"]]}},{"id":"crew","title":"04 · Personnel navigant","blocks":[["Licences et privilèges","Les licences et qualifications sont délivrées selon les cadres réglementaires applicables. Un pilote ne peut exercer que les privilèges correspondant à sa licence et à ses qualifications valides."],["Formation planeur","Le support décrit le parcours SPL : formation en DTO/ATO, instruction théorique, instruction en vol, vol solo sous conditions, examen théorique et épreuve pratique. Les conditions d’âge, d’expérience et de médical sont précisées dans les diapositives."],["Médical et expérience récente","Le pilote doit conserver une aptitude médicale adaptée et maintenir son expérience récente. En cas de maladie, traitement ou incapacité temporaire pouvant affecter la sécurité, il doit s’abstenir de voler."],["Qualifications particulières","Le support aborde notamment TMG, voltige, instructeurs et examinateurs, ainsi que les conditions de formation et de maintien des privilèges."]],"recall":{"q":"Quels principes encadrent l’exercice des privilèges d’une licence et l’aptitude médicale du pilote ?","ref":"Les privilèges sont limités à la licence et aux qualifications valides. Le pilote doit maintenir son aptitude médicale et son expérience récente ; il ne vole pas si son état ou un traitement peut affecter la sécurité.","groups":[["privilèges"],["licence"],["qualification"],["valide"],["médical","aptitude"],["expérience récente"],["s’abstenir","ne pas voler"]]},"qcm":{"q":"Un pilote peut-il exercer des privilèges qui ne figurent pas dans sa licence ou ses qualifications ?","o":["Oui, si l’aéronef est disponible","Non, les privilèges sont limités aux droits détenus","Oui, avec l’accord des passagers","Oui, en espace non contrôlé"],"a":1,"e":"Les privilèges sont limités à ceux que la licence et les qualifications autorisent."},"tf":{"q":"Un certificat médical valide oblige toujours le pilote à voler, même s’il est temporairement malade.","a":false,"e":"Le pilote doit s’abstenir de voler si son état peut affecter la sécurité."},"exam":{"q":"Quel organisme de formation peut intervenir dans la formation SPL selon le support ?","o":["DTO ou ATO","Uniquement l’OFAC","Uniquement un exploitant d’aérodrome","Une compagnie aérienne uniquement"],"a":0,"e":"Le support cite les DTO et ATO."},"open":{"q":"Que doit faire un pilote si une maladie ou un traitement peut affecter la sécurité du vol ?","ref":"Il doit s’abstenir de voler et demander conseil selon les procédures médicales applicables.","groups":[["s’abstenir","ne pas voler"],["sécurité"],["médecin","conseil"]]}},{"id":"airrules","title":"05 · Règles de l’air","blocks":[["SERA et application","Le règlement SERA harmonise les règles de l’air en Europe. En Suisse, l’ordonnance du DETEC relative aux règles de l’air complète ce cadre. Le PIC est responsable de la conduite et de la sécurité du vol."],["VFR et IFR","Le VFR s’appuie sur les références visuelles extérieures et les conditions VMC. L’IFR repose sur les références instrumentales, des conditions de vol adaptées, un pilote qualifié IR et un aéronef qualifié."],["Prévention des collisions","Les pilotes appliquent les règles de priorité, de convergence, de face-à-face et de dépassement. La règle générale impose de voir et éviter, sans remplacer les règles spécifiques."],["Hauteurs de survol","Le support rappelle les minima SERA : hors agglomération, 150 m/500 ft au-dessus de l’obstacle le plus élevé dans un rayon de 150 m ; en zones densément peuplées, 300 m/1000 ft dans un rayon de 600 m, avec exceptions précisées au cours."]],"recall":{"q":"Distingue VFR et IFR et rappelle les responsabilités du PIC.","ref":"VFR : références visuelles et VMC. IFR : références instrumentales, pilote IR et aéronef qualifié. Le PIC est responsable de la conduite et de la sécurité du vol et du respect des règles et instructions.","groups":[["VFR"],["visuelles"],["VMC"],["IFR"],["instrumentales"],["IR"],["PIC"],["responsable"],["sécurité"]]},"qcm":{"q":"Quelles références sont utilisées en vol VFR ?","o":["Références instrumentales uniquement","Références visuelles extérieures","Aucune référence","Uniquement radar"],"a":1,"e":"Le VFR repose sur les références visuelles extérieures."},"tf":{"q":"En convergence, deux aéronefs doivent en principe obliquer vers la droite.","a":true,"e":"Le support décrit la manœuvre d’évitement par la droite pour les aéronefs en convergence."},"exam":{"q":"Quelle hauteur minimale générale est citée hors agglomération, au-dessus de l’obstacle le plus élevé dans un rayon de 150 m ?","o":["50 m","100 m","150 m","300 m"],"a":2,"e":"Le support cite 150 m (500 ft), sous réserve des exceptions."},"open":{"q":"Qui est responsable de la conduite et de la sécurité du vol ?","ref":"Le pilote commandant de bord (PIC).","groups":[["PIC"],["pilote commandant de bord"],["responsable"],["sécurité"]]}},{"id":"procedures","title":"06 · Procédures","blocks":[["Responsabilité avant et pendant le vol","Avant le vol, le PIC prend connaissance des renseignements utiles, vérifie le fonctionnement de l’aéronef et de ses équipements et tient compte des besoins en carburant. En vol, il respecte les règles de l’air et les instructions du contrôle."],["Circulation aérienne","Le support distingue circulation générale et circulation militaire, ainsi que les vols VFR et IFR. Les services ATS contribuent à la prévention des abordages, à la régulation et à l’information des pilotes."],["Communications et transpondeur","Le transpondeur répond aux interrogations radar et transmet des informations d’identification. Codes particuliers du support : 7000 VFR, 7500 intervention illicite, 7600 panne radio, 7700 détresse/urgence."]],"recall":{"q":"Que doit faire le PIC avant le vol et quels sont les codes transpondeur particuliers cités ?","ref":"Avant le vol : recueillir les renseignements utiles, vérifier l’aéronef et les équipements, considérer le carburant. Codes : 7000 VFR, 7500 intervention illicite, 7600 panne radio, 7700 détresse ou urgence.","groups":[["renseignements"],["vérifier","fonctionnement"],["équipements"],["carburant"],["7000"],["7500"],["7600"],["7700"]]},"qcm":{"q":"Quel code transpondeur correspond à une panne radio ?","o":["7000","7500","7600","7700"],"a":2,"e":"7600 signale une panne radio."},"tf":{"q":"Le code 7700 est associé à une situation de détresse ou d’urgence.","a":true,"e":"Le support associe 7700 à une situation de détresse, d’urgence ou d’interception."},"exam":{"q":"Quel code correspond à une intervention illicite ?","o":["7000","7500","7600","7700"],"a":1,"e":"7500 est le code d’intervention illicite."},"open":{"q":"Cite les actions essentielles du PIC avant le départ.","ref":"Prendre connaissance des renseignements utiles, vérifier l’aéronef et les équipements, tenir compte des besoins en carburant.","groups":[["renseignements"],["aéronef"],["équipements"],["carburant"]]}},{"id":"airspace","title":"07 · Espaces aériens","blocks":[["Organisation","L’espace aérien est constitué de volumes tridimensionnels définis par des limites latérales, un plancher et un plafond. Les cartes représentent ces volumes avec des conventions et des classes."],["Classes et services","Le support distingue espaces contrôlés A à E et non contrôlés F et G. Les classes déterminent les services et contraintes applicables aux vols VFR et IFR."],["Structure suisse","Le support présente la FIR suisse LSAS du sol au FL195 et les services d’information de vol de Genève et Zurich. Il aborde aussi les CTR, TMA et autres structures."],["Zones particulières","Les zones réglementées, dangereuses et interdites imposent des restrictions différentes. Leur statut et leur activité doivent être vérifiés avant le vol."]],"recall":{"q":"Explique comment l’espace aérien est structuré et distingue espace contrôlé et non contrôlé.","ref":"Les volumes ont des limites latérales, un plancher et un plafond. Le support classe A à E comme contrôlées et F à G comme non contrôlées ; les services et contraintes varient selon la classe.","groups":[["volume","tridimensionnel"],["limites latérales"],["plancher"],["plafond"],["A à E","A B C D E"],["contrôlé"],["F à G","F G"],["non contrôlé"]]},"qcm":{"q":"Quelles classes sont présentées dans le support comme espaces aériens contrôlés ?","o":["A, B, C, D et E","F et G","Uniquement C et D","A et G"],"a":0,"e":"Le support indique A, B, C, D et E comme classes contrôlées."},"tf":{"q":"La FIR suisse LSAS est présentée du sol au FL195.","a":true,"e":"C’est la structure indiquée dans les diapositives."},"exam":{"q":"Comment appelle-t-on la limite verticale inférieure d’un espace aérien ?","o":["Plafond","Plancher","Limite latérale","Niveau de transition"],"a":1,"e":"Le plancher est la limite verticale inférieure."},"open":{"q":"Quels éléments définissent un volume d’espace aérien ?","ref":"Les limites latérales, le plancher et le plafond.","groups":[["latérales"],["plancher"],["plafond"]]}},{"id":"aeronautical-info","title":"08 · Information aéronautique","blocks":[["AIP","L’AIP (Aeronautical Information Publication) rassemble les informations aéronautiques durables essentielles à la navigation."],["NOTAM","Le NOTAM diffuse des informations temporaires ou urgentes concernant l’établissement, l’état ou la modification d’installations, services, procédures ou dangers."],["AIC","La circulaire AIC diffuse des informations qui ne remplissent pas les critères d’un NOTAM ou d’une inclusion dans l’AIP, mais qui présentent un intérêt aéronautique."],["Préparation","Le pilote consulte les publications et informations à jour avant le vol. Les cartes, NOTAM et autres publications doivent être utilisés ensemble selon le contexte."]],"recall":{"q":"Distingue AIP, NOTAM et AIC.","ref":"AIP : informations aéronautiques durables. NOTAM : informations temporaires ou urgentes. AIC : informations utiles ne remplissant pas les critères d’un NOTAM ou d’une inclusion dans l’AIP.","groups":[["AIP"],["durable"],["NOTAM"],["temporaire","urgent"],["AIC"],["ne remplissent pas","pas les critères"]]},"qcm":{"q":"Quel document diffuse principalement des informations temporaires ou urgentes ?","o":["AIP","NOTAM","AIC","Manuel de vol"],"a":1,"e":"Le NOTAM diffuse les informations temporaires ou urgentes."},"tf":{"q":"Une AIC peut contenir des informations qui ne remplissent pas les critères d’un NOTAM ou de l’AIP.","a":true,"e":"C’est la distinction présentée dans le support."},"exam":{"q":"Quel support rassemble les informations aéronautiques durables essentielles ?","o":["AIP","NOTAM","AIC","Carnet de route"],"a":0,"e":"L’AIP rassemble les informations aéronautiques durables."},"open":{"q":"À quoi sert une AIC ?","ref":"À diffuser des informations aéronautiques utiles ne remplissant pas les conditions d’un NOTAM ou d’une inclusion dans l’AIP.","groups":[["AIC"],["informations"],["NOTAM"],["AIP"]]}},{"id":"aerodrome","title":"09 · Aérodrome","blocks":[["Exploitation","Le règlement d’exploitation décrit l’organisation et les conditions d’utilisation de l’aérodrome : horaires, procédures, installations, circulation et services."],["Aires et signaux","Le pilote respecte les signaux, marquages et consignes de l’aérodrome. Les signaux lumineux et aires à signaux transmettent des instructions ou informations opérationnelles."],["Circulation au sol","La circulation des aéronefs et véhicules doit suivre les voies, règles et instructions applicables. Le pilote maintient la vigilance et évite les collisions au sol."]],"recall":{"q":"Que règle le règlement d’exploitation d’un aérodrome ?","ref":"Il fixe l’organisation, les horaires, les procédures d’approche et de départ, l’utilisation des installations et les services associés.","groups":[["organisation"],["horaires","heures d’ouverture"],["procédures"],["approche"],["départ"],["installations"],["services"]]},"qcm":{"q":"Le règlement d’exploitation d’un aérodrome traite notamment des procédures et de l’utilisation des installations.","a":true,"e":"Ces éléments font partie de son contenu."},"tf":{"q":"Quel document décrit l’organisation et les conditions d’utilisation de l’aérodrome ?","o":["Règlement d’exploitation","Manuel de vol","Carnet de route","Certificat acoustique"],"a":0,"e":"Le règlement d’exploitation décrit l’organisation et l’utilisation de l’aérodrome."},"exam":{"q":"Cite deux éléments couverts par le règlement d’exploitation d’un aérodrome.","ref":"Par exemple : horaires d’ouverture, procédures, utilisation des installations, circulation et services.","groups":[["horaires","ouverture"],["procédures"],["installations"],["circulation","services"]]}},{"id":"sar","title":"10 · Recherche et sauvetage","blocks":[["Alerte et SAR","Le support rappelle l’obligation d’annoncer un accident ou un incident grave et d’alerter les organismes de recherche et de sauvetage (SAR)."],["Suisse","Le support cite le SESE et la REGA dans l’organisation suisse de sécurité et de sauvetage. Le numéro REGA indiqué est 1414."],["Balises","Les ELT sont des émetteurs de localisation d’urgence aéronautiques. Les PLB sont des balises personnelles. Les balises 406 MHz peuvent également émettre sur 121,5 MHz."]],"recall":{"q":"Que signifient SAR, ELT et PLB, et quels organismes suisses sont cités dans le support ?","ref":"SAR : Search and Rescue. ELT : Emergency Locator Transmitter, balise aéronautique. PLB : Personal Locator Beacon, balise personnelle. Le support cite le SESE et la REGA (1414).","groups":[["SAR"],["search and rescue"],["ELT"],["emergency locator"],["PLB"],["personal locator"],["SESE"],["REGA"],["1414"]]},"qcm":{"q":"Quel numéro REGA est indiqué dans le support ?","o":["112","117","1414","144"],"a":2,"e":"Le support indique le 1414."},"tf":{"q":"Une ELT est une balise de localisation d’urgence destinée à l’usage aéronautique.","a":true,"e":"ELT signifie Emergency Locator Transmitter."},"exam":{"q":"Quelle fréquence complémentaire est mentionnée pour certaines balises 406 MHz ?","o":["118,0 MHz","121,5 MHz","123,45 MHz","243,0 MHz"],"a":1,"e":"Le support mentionne également 121,5 MHz."},"open":{"q":"Distingue ELT et PLB.","ref":"ELT : balise aéronautique de localisation d’urgence. PLB : balise personnelle utilisable pour signaler une personne en détresse.","groups":[["ELT"],["aéronautique"],["PLB"],["personnelle"]]}}]};
const state=loadState();
function loadState(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');return d&&typeof d==='object'?d:{}}catch(e){return{}}}
let data=Object.assign({subjects:{},seconds:0,timeBySubject:{},last:null,updated:null},state);if(!data.subjects)data.subjects={};if(!data.timeBySubject)data.timeBySubject={};
let subject=null,lessonId=null,step=0,practiceList=[],pIndex=0,pCorrect=0,pTotal=0,checked=false,lastGrade=null,reviewMode=false;
const $=s=>document.querySelector(s),app=$('#app');
function save(){data.updated=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function ensure(sub,id){data.subjects[sub]=data.subjects[sub]||{};data.subjects[sub][id]=data.subjects[sub][id]||{attempts:0,correct:0,wrong:0,level:-1,streak:0,due:null,errors:{},qstats:{},last:null};return data.subjects[sub][id]}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function today(){return new Date().toISOString().slice(0,10)}
function dueItems(){const a=[];Object.keys(data.subjects).forEach(s=>Object.keys(data.subjects[s]||{}).forEach(id=>{const x=data.subjects[s][id];if(x.due&&x.due<=today())a.push({s,id,due:x.due})}));return a}
function mastered(x){const n=x.correct+x.wrong;return x.level>=3&&x.streak>=4&&n>=10&&x.correct/Math.max(1,n)>=.8}
function courseStats(s){const list=lessons[s]||[],rows=list.map(l=>ensure(s,l.id)),done=rows.filter(mastered).length,attempts=rows.reduce((n,x)=>n+x.correct+x.wrong,0),correct=rows.reduce((n,x)=>n+x.correct,0),wrong=rows.reduce((n,x)=>n+x.wrong,0),due=rows.filter(x=>x.due&&x.due<=today()).length;return{total:list.length,done,progress:list.length?Math.round(done/list.length*100):0,attempts,correct,wrong,due,rows}}
function fmtTime(n){const h=Math.floor(n/3600),m=Math.floor(n%3600/60);return h?h+' h '+m+' min':m+' min'}
function linkOriginal(s){window.parent.postMessage({type:'ppl-coach-open-branch',code:s},location.origin)}
function dashboard(){subject=null;lessonId=null;const a=courseStats('050'),b=courseStats('010'),due=dueItems(),totalDone=a.done+b.done,totalDue=due.length,totalAttempts=a.attempts+b.attempts;
app.innerHTML='<div class="bar"><span class="hint">Les fiches complètes et les entraînements déjà présents restent accessibles.</span><span class="pill">Temps étudié : '+fmtTime(data.seconds)+'</span></div><section class="kpis"><div class="kpi"><b>'+totalDone+' / '+(a.total+b.total)+'</b><span>leçons maîtrisées par révisions</span></div><div class="kpi"><b>'+totalDue+'</b><span>notions à revoir aujourd’hui</span></div><div class="kpi"><b>'+totalAttempts+'</b><span>réponses données · '+(a.correct+b.correct)+' justes / '+(a.wrong+b.wrong)+' fausses</span></div><div class="kpi"><b>'+fmtTime(data.seconds)+'</b><span>temps d’apprentissage dans ce navigateur</span></div></section><div class="grid">'+courseCard('050','Météorologie',a,'6 chapitres · cours et BAK déjà disponibles dans le site')+courseCard('010','Droit aérien',b,'10 chapitres · cours basé sur le PowerPoint officiel')+'</div><section class="panel"><h2>Révisions prévues aujourd’hui</h2><p class="hint">'+(due.length?due.length+' leçon(s) à revoir. Les réponses incorrectes reviennent dès le lendemain.':'Aucune révision échue. Tes leçons reviennent selon le calendrier 1, 3, 7, 14 et 30 jours.')+'</p>'+(due.length?'<div class="actions"><button class="btn primary" id="start-due">Commencer la prochaine révision →</button></div>':'')+'<p class="hint">Une leçon n’est acquise qu’après plusieurs rappels espacés réussis : la lecture seule ne valide jamais la progression.</p></section><p class="hint">Progression sauvegardée dans ce navigateur et associée à ton compte connecté. Elle n’est pas synchronisée entre appareils.</p>';
document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>course(b.dataset.course));if($('#start-due'))$('#start-due').onclick=()=>{const d=dueItems()[0];if(d)openLesson(d.s,d.id,1)}}
function courseCard(s,name,st,sub){return'<section class="course-card"><p class="tag">'+s+' · PPL(A)</p><h2>'+name+'</h2><p class="hint">'+sub+'</p><div class="meter"><span style="width:'+st.progress+'%"></span></div><p><b>'+st.progress+' %</b> de maîtrise · '+st.done+' / '+st.total+' leçons acquises</p><div class="kpis"><div class="kpi"><b>'+st.due+'</b><span>à revoir</span></div><div class="kpi"><b>'+st.correct+' / '+st.wrong+'</b><span>justes / fausses</span></div></div><button class="btn primary" data-course="'+s+'">Ouvrir '+name+' →</button></section>'}
function course(s){subject=s;lessonId=null;const st=courseStats(s),title=s==='050'?'Météorologie':'Droit aérien';app.innerHTML='<div class="bar"><button class="btn" id="home">← Tableau du coach</button><h2>'+s+' · '+title+'</h2><span class="pill">'+st.progress+' % maîtrisé</span></div><section class="panel"><p class="hint">Chaque chapitre est une leçon. Lis les notions, teste ta mémoire sans le cours, entraîne-toi sur quatre formats puis reviens aux rappels programmés. Les leçons maîtrisées exigent plusieurs révisions espacées.</p>'+(s==='050'?'<button class="btn" id="source-course">Consulter la fiche complète, le BAK et les QCM 050</button>':'<button class="btn" id="source-course">Consulter la fiche de cours 010</button> '+(s==='010'?'<span class="hint">Cours réorganisé selon les 10 chapitres du PowerPoint. Les banques de QCM sont accessibles ci-dessous.</span>':''))+'</section>'+(s==='010'?'<section class="panel"><h2>🎯 Banque de questions 010</h2><p class="hint">Entraînement direct sur les questions du PowerPoint, de la banque complémentaire et de Code X. Correction immédiate et suivi de tes résultats.</p><div class="actions"><button class="btn primary" id="open-bank-010">Ouvrir les banques de questions →</button></div></section>':'')+'<div class="lesson-grid"><aside class="panel lesson-nav"><h2>Chapitres / leçons</h2><div class="list">'+(lessons[s]||[]).map(l=>{const x=ensure(s,l.id),status=mastered(x)?'✓ Maîtrisée':x.due&&x.due<=today()?'À revoir aujourd’hui':x.attempts?'En cours':'À découvrir';return'<button class="lesson-btn" data-lesson="'+l.id+'"><span class="name">'+l.title+'</span><span class="status">'+status+'</span></button>'}).join('')+'</div></aside><section id="lesson-area"><div class="panel"><h2>Choisis un chapitre</h2><p class="hint">Ta progression et tes erreurs seront enregistrées pour chaque leçon.</p></div></section></div>';
$('#home').onclick=dashboard;$('#source-course').onclick=()=>linkOriginal(s);if($('#open-bank-010'))$('#open-bank-010').onclick=()=>bank010Home();document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(s,b.dataset.lesson,0))}
function openLesson(s,id,initialStep){subject=s;lessonId=id;step=initialStep||0;reviewMode=initialStep===1;lastGrade=null;practiceList=[];pIndex=0;pCorrect=0;pTotal=0;checked=false;data.last={s,id};save();renderLesson()}
function renderLesson(){const l=(lessons[subject]||[]).find(x=>x.id===lessonId);if(!l){dashboard();return}const stats=ensure(subject,lessonId),done=mastered(stats),due=stats.due;
const stages=['Comprendre','Mémoriser','S’entraîner','Réviser'];
let left='<div class="bar"><button class="btn" id="back-course">← Chapitres</button><span class="tag">'+subject+' · '+l.title+'</span></div><div class="lesson-grid"><aside class="panel lesson-nav"><h2>Ton parcours</h2><div class="tabs">'+stages.map((s,i)=>'<button class="tab" data-step="'+i+'" '+(step===i?'aria-current="true"':'')+'>'+(i+1)+' · '+s+'</button>').join('')+'</div><div class="meter"><span style="width:'+Math.round((step+1)/4*100)+'%"></span></div><p class="hint">Maîtrise : '+(done?'acquise après rappels espacés':stats.attempts?'en cours':'pas encore évaluée')+'</p><p class="hint">Réponses : '+stats.correct+' justes · '+stats.wrong+' fausses</p>'+(due?'<p class="'+(due<=today()?'due':'hint')+'">Prochaine révision : '+due+'</p>':'')+'</aside><div id="stage-area"></div></div>';$('#lesson-area').innerHTML=left;$('#back-course').onclick=()=>course(subject);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);reviewMode=false;renderLesson()});renderStage(l,stats)}
function renderStage(l,x){const box=$('#stage-area');
if(step===0){box.innerHTML='<section class="panel"><p class="tag">ÉTAPE 1 · COMPRENDRE</p><h2>'+l.title+'</h2><p class="hint">Lis les petites sections, puis ferme le cours et essaie de les retrouver de mémoire.</p>'+(subject==='050'?'<div class="source"><button class="btn" id="open-original">Fiche complète et BAK 050 ↗</button></div>':'<div class="source"><button class="btn" id="open-original">Fiche complète 010 ↗</button><span class="hint">Le document BAK 010 n’a pas été fourni.</span></div>')+l.blocks.map(b=>'<article class="lesson-card"><h2>'+b[0]+'</h2><p>'+b[1]+'</p></article>').join('')+'<div class="callout"><b>Rappel :</b> lire ne valide pas la leçon. Utilise « Tester ma mémoire » pour vérifier ce que tu sais sans regarder.</div><button class="btn primary" id="memory">Tester ma mémoire →</button></section>';$('#open-original').onclick=()=>linkOriginal(subject);$('#memory').onclick=()=>{step=1;reviewMode=false;renderLesson()};return}
if(step===1){const r=l.recall;box.innerHTML='<section class="panel"><p class="tag">ÉTAPE 2 · MÉMORISER PAR RAPPEL ACTIF</p><h2>Ferme le cours. Réponds sans le regarder.</h2><article class="question"><h3>'+r.q+'</h3><textarea id="recall-answer" placeholder="Explique la notion avec tes mots…"></textarea><div class="actions"><button class="btn primary" id="grade-recall">Comparer à la réponse attendue</button></div><div id="recall-feedback"></div></article><p class="hint">La correction vérifie plusieurs idées essentielles et tolère les accents, la ponctuation et des formulations proches.</p></section>';$('#grade-recall').onclick=()=>{if(lastGrade)return;const g=gradeText($('#recall-answer').value,r.groups),ok=g.ratio>=.6;lastGrade={correct:ok,ratio:g.ratio};recordAnswer(l,'recall',ok);schedule(l,ok);$('#recall-feedback').innerHTML=feedback(ok,g,r.ref,r.groups)+'<div class="actions"><button class="btn primary" id="to-practice">Continuer vers l’entraînement →</button></div>';$('#to-practice').onclick=()=>{step=2;lastGrade=null;renderLesson()}};return}
if(step===2){if(!practiceList.length){practiceList=[{type:'qcm',...l.qcm,id:l.id+'-qcm'},{type:'vf',...l.tf,id:l.id+'-vf'},{type:'open',...l.open,id:l.id+'-open'},{type:'exam',...l.exam,id:l.id+'-exam'}];pIndex=0;pCorrect=0;pTotal=0;checked=false}
renderPractice(l,x);return}
if(step===3){const history=Object.keys(x.errors||{}).sort((a,b)=>(x.errors[b]||0)-(x.errors[a]||0));const next=x.due?new Date(x.due+'T00:00:00'):null;const mastery=mastered(x);box.innerHTML='<section class="panel"><p class="tag">ÉTAPE 4 · RÉVISER</p><h2>'+l.title+' · '+(mastery?'Maîtrise confirmée':'Progression de mémorisation')+'</h2><div class="kpis"><div class="kpi"><b>'+(x.level<0?'—':DELAYS[Math.min(x.level,4)])+' j</b><span>intervalle actuel</span></div><div class="kpi"><b>'+x.streak+'</b><span>rappels espacés réussis</span></div><div class="kpi"><b>'+x.correct+' / '+(x.correct+x.wrong)+'</b><span>réponses justes</span></div></div><p>'+(mastery?'Leçon maîtrisée : plusieurs rappels espacés réussis, avec un taux d’au moins 80 %.':'La lecture seule ne suffit pas. Réussis plusieurs rappels aux échéances pour valider cette leçon.')+'</p><p class="'+(x.due&&x.due<=today()?'due':'hint')+'">'+(x.due?'Prochaine révision prévue le '+x.due+'.': 'La prochaine révision sera programmée après ton premier rappel réussi.')+'</p><div class="actions"><button class="btn primary" id="review-now">Tester ma mémoire</button><button class="btn" id="train-again">Refaire les questions</button><button class="btn" id="return-course">Retour aux chapitres</button></div></section><section class="panel"><h2>Erreurs fréquentes</h2>'+(history.length?history.slice(0,5).map(id=>'<div class="error-row">'+questionName(l,id)+' · '+x.errors[id]+' erreur(s)</div>').join(''):'<p class="hint">Pas encore d’erreurs enregistrées.</p>')+'</section>';$('#review-now').onclick=()=>{lastGrade=null;step=1;reviewMode=true;renderLesson()};$('#train-again').onclick=()=>{practiceList=[];step=2;renderLesson()};$('#return-course').onclick=()=>course(subject)}
}

let bank010Session=[],bank010Index=0,bank010Score=0,bank010Graded=0,bank010Locked=false;
function bank010Home(){
 subject='010';lessonId=null;
 const stats=data.bank010||{attempts:0,correct:0};
 app.innerHTML='<div class="bar"><button class="btn" id="bank-back">← Retour aux chapitres</button><h2>010 · Entraînement QCM</h2></div><section class="panel"><h2>Choisir une banque</h2><p class="hint">La banque PowerPoint contient '+bank010.filter(q=>q.source==="PowerPoint").length+' questions présentes dans le fichier de la fiche. Les deux autres banques sont conservées séparément.</p><div class="field"><label for="bank-source">Banque</label><select id="bank-source"><option value="all">Banque complète · '+bank010.length+' questions</option><option value="ppt">PowerPoint · '+bank010.filter(q=>q.source==="PowerPoint").length+' questions</option><option value="extra">Banque complémentaire · '+bank010.filter(q=>q.source==="Banque complémentaire").length+' questions</option><option value="codex">Code X · '+bank010.filter(q=>(q.source||"").startsWith("Code X")).length+' questions</option></select></div><div class="field"><label for="bank-topic">Chapitre</label><select id="bank-topic"><option value="all">Tous les chapitres</option>'+['Droit international et droit suisse','Navigabilité et documents de bord','Nationalité et immatriculation','Personnel navigant','Règles de l’air','Procédures','Espaces aériens','Information aéronautique','Aérodrome','Recherche et sauvetage'].map((n,i)=>'<option value="'+(i+1)+'">'+(i+1)+'. '+n+'</option>').join('')+'</select></div><div class="field"><label for="bank-count">Nombre de questions</label><select id="bank-count"><option value="10">10 questions</option><option value="20">20 questions</option><option value="50">50 questions</option><option value="all">Toutes les questions disponibles</option></select></div><div class="actions"><button class="btn primary" id="bank-start">Commencer l’entraînement →</button></div></section><section class="panel"><h2>Ton entraînement</h2><div class="kpis"><div class="kpi"><b>'+stats.attempts+'</b><span>questions répondues</span></div><div class="kpi"><b>'+stats.correct+'</b><span>réponses justes</span></div></div><p class="hint">Les questions sans corrigé visible dans le document sont signalées et exclues du calcul de réussite.</p></section>';
 $('#bank-back').onclick=()=>course('010');
 $('#bank-start').onclick=()=>{const source=$('#bank-source').value,topic=$('#bank-topic').value,count=$('#bank-count').value;let pool=bank010.filter(q=>(source==='all'||(source==='ppt'?q.source==='PowerPoint':source==='extra'?q.source==='Banque complémentaire':(q.source||'').startsWith('Code X')))&&(topic==='all'||String(q.t)===topic));if(!pool.length){alert('Aucune question pour cette sélection.');return}bank010Session=shuffleBank(pool).slice(0,count==='all'?pool.length:Math.min(Number(count),pool.length));bank010Index=0;bank010Score=0;bank010Graded=0;bank010Locked=false;bank010Question()};
}
function shuffleBank(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function bank010Question(){
 const q=bank010Session[bank010Index],name=['','Droit international','Navigabilité et documents','Immatriculation','Personnel navigant','Règles de l’air','Procédures','Espaces aériens','Information aéronautique','Aérodrome','Recherche et sauvetage'][q.t]||'Droit aérien';
 app.innerHTML='<div class="bar"><button class="btn" id="bank-exit">Quitter l’entraînement</button><span class="pill">Question '+(bank010Index+1)+' / '+bank010Session.length+'</span></div><section class="panel"><div class="meter"><span style="width:'+Math.round(bank010Index/bank010Session.length*100)+'%"></span></div><p class="tag">'+name+' · '+(q.source||'PowerPoint')+'</p><h2>'+q.q+'</h2>'+(q.image?'<img alt="Illustration de la question" src="'+q.image+'" style="display:block;max-width:240px;max-height:170px;object-fit:contain;margin:12px 0;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px">':'')+'<div class="choices">'+q.o.map((v,i)=>'<button class="choice" data-bank-pick="'+i+'">'+String.fromCharCode(65+i)+'. '+v+'</button>').join('')+'</div><div id="bank-feedback"></div><div class="actions"><button class="btn primary" id="bank-next" disabled>' +(bank010Index+1===bank010Session.length?'Voir le résultat':'Question suivante →')+'</button></div></section>';
 $('#bank-exit').onclick=bank010Home;
 document.querySelectorAll('[data-bank-pick]').forEach(b=>b.onclick=()=>bank010Answer(Number(b.dataset.bankPick)));
 $('#bank-next').onclick=()=>{if(bank010Index+1<bank010Session.length){bank010Index++;bank010Locked=false;bank010Question()}else bank010Finish()};
}
function bank010Answer(n){
 if(bank010Locked)return;bank010Locked=true;
 const q=bank010Session[bank010Index],known=q.a>=0,ok=known&&n===q.a;
 if(known){bank010Graded++;if(ok)bank010Score++}
 const s=data.bank010||(data.bank010={attempts:0,correct:0});s.attempts++;if(ok)s.correct++;save();
 document.querySelectorAll('[data-bank-pick]').forEach((b,i)=>{b.disabled=true;if(known&&i===q.a)b.classList.add('correct');if(known&&i===n&&!ok)b.classList.add('wrong')});
 $('#bank-feedback').innerHTML='<div class="feedback '+(known?(ok?'good':'bad'):'bad')+'"><b>'+(known?(ok?'✓ Bonne réponse':'✗ Réponse incorrecte'):'Correction non fournie')+'</b><p>'+(known?'<b>Réponse attendue :</b> '+q.o[q.a]:'Aucune réponse correcte n’est indiquée dans la page reçue.')+'</p><p>'+q.e+'</p></div>';
 $('#bank-next').disabled=false;
}
function bank010Finish(){
 const rate=bank010Graded?Math.round(bank010Score/bank010Graded*100):0;
 app.innerHTML='<div class="bar"><button class="btn" id="bank-back">← Retour aux banques</button><h2>Résultat de la série</h2></div><section class="panel"><div class="kpis"><div class="kpi"><b>'+bank010Score+' / '+bank010Graded+'</b><span>réponses justes</span></div><div class="kpi"><b>'+rate+' %</b><span>réussite sur questions corrigées</span></div><div class="kpi"><b>'+bank010Session.length+'</b><span>questions présentées</span></div></div><p>'+(bank010Graded<bank010Session.length?'Certaines questions étaient sans corrigé et ne sont pas incluses dans le pourcentage.':'Toutes les questions de cette série étaient corrigées.')+'</p><div class="actions"><button class="btn primary" id="bank-again">Nouvelle série</button><button class="btn" id="bank-chapters">Retour aux chapitres</button></div></section>';
 $('#bank-back').onclick=bank010Home;$('#bank-again').onclick=bank010Home;$('#bank-chapters').onclick=()=>course('010');
}
function shuffle(a){return shuffleBank(a)}

function feedback(ok,g,ref,groups){const missed=g.missing.length?'<p><b>Éléments à revoir :</b> '+g.missing.join(' · ')+'</p>':'';return'<div class="feedback '+(ok?'good':'bad')+'"><b>'+(ok?'✓ Les notions principales sont là.':'✗ Il manque encore des éléments importants.')+'</b><p><b>Réponse de référence :</b> '+ref+'</p>'+missed+'<p class="small">La correction est indicative et basée sur les mots et idées clés de la fiche.</p></div>'}
function gradeText(text,groups){const words=norm(text),hit=[],missing=[];groups.forEach(g=>{const terms=Array.isArray(g)?g:(g.terms||[]),label=Array.isArray(g)?g[0]:(g.label||terms[0]);const yes=terms.some(t=>hasTerm(words,t));(yes?hit:missing).push(label)});return{ratio:groups.length?hit.length/groups.length:0,hit,missing}}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function hasTerm(text,term){const phrase=norm(term),w=text.split(' '),p=phrase.split(' ');if(p.every(v=>w.includes(v)))return true;return p.some(v=>w.some(x=>x===v||(Math.min(x.length,v.length)>=5&&lev(x,v)<=1)))}
function lev(a,b){let r=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let prev=r[0];r[0]=i;for(let j=1;j<=b.length;j++){const t=r[j];r[j]=Math.min(r[j]+1,r[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return r[b.length]}
function recordAnswer(l,qid,ok){const x=ensure(subject,l.id);x.attempts++;x.last=today();x[ok?'correct':'wrong']++;x.qstats[qid]=x.qstats[qid]||{r:0,w:0};x.qstats[qid][ok?'r':'w']++;if(!ok)x.errors[qid]=(x.errors[qid]||0)+1;save()}
function schedule(l,ok){const x=ensure(subject,l.id),now=today();if(!ok){x.level=0;x.streak=0;x.due=addDays(1)}else if(x.level<0){x.level=0;x.streak=1;x.due=addDays(1)}else if(x.due&&x.due<=now){x.level=Math.min(x.level+1,4);x.streak++;x.due=addDays(DELAYS[x.level])}else if(!x.due){x.level=0;x.streak=1;x.due=addDays(1)}x.last=now;save()}
function renderPractice(l,x){if(pIndex>=practiceList.length){const acc=pTotal?pCorrect/pTotal:0;schedule(l,acc>=.8);step=3;practiceList=[];renderLesson();return}const q=practiceList[pIndex],label={qcm:'QCM',vf:'Vrai ou faux',open:'Question ouverte',exam:'Mise en situation PPL'}[q.type];let prompt='',ctrl='';
if(q.type==='qcm'||q.type==='exam')ctrl='<div class="choices">'+q.o.map((v,i)=>'<button class="choice" data-pick="'+i+'">'+String.fromCharCode(65+i)+'. '+v+'</button>').join('')+'</div>';
if(q.type==='vf')ctrl='<div class="actions"><button class="choice" data-pick="true">Vrai</button><button class="choice" data-pick="false">Faux</button></div>';
if(q.type==='open')ctrl='<textarea id="open-answer" placeholder="Réponds avec tes mots…"></textarea><div class="actions"><button class="btn primary" id="check-open">Vérifier ma réponse</button></div>';
$('#stage-area').innerHTML='<section class="panel"><p class="tag">ÉTAPE 3 · S’ENTRAÎNER · '+label+'</p><h2>'+l.title+'</h2><div class="meter"><span style="width:'+Math.round(pIndex/practiceList.length*100)+'%"></span></div><p class="hint">Question '+(pIndex+1)+' / '+practiceList.length+' · Score de la série : '+pCorrect+' / '+pTotal+'</p><article class="question"><h3>'+q.q+'</h3>'+ctrl+'<div id="practice-feedback"></div><div class="actions"><button class="btn primary" id="practice-next" disabled>'+(pIndex+1===practiceList.length?'Terminer la série':'Question suivante →')+'</button></div></article></section>';
function answer(val){if(checked)return;checked=true;let ok=false,g=null,ref='';if(q.type==='qcm'||q.type==='exam'){ok=Number(val)===q.a;ref=q.o[q.a];}else if(q.type==='vf'){ok=String(val)===String(q.a);ref=q.a?'Vrai':'Faux';}else{g=gradeText(val,q.groups);ok=g.ratio>=.75;ref=q.ref}
pTotal++;if(ok)pCorrect++;recordAnswer(l,q.id,ok);const explain=q.type==='open'?feedback(ok,g,ref,q.groups):'<div class="feedback '+(ok?'good':'bad')+'"><b>'+(ok?'✓ Bonne réponse':'✗ Réponse incorrecte')+'</b><p><b>Réponse attendue :</b> '+ref+'</p><p>'+q.e+'</p></div>';$('#practice-feedback').innerHTML=explain;$('#practice-next').disabled=false}
document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>answer(b.dataset.pick));if($('#check-open'))$('#check-open').onclick=()=>answer($('#open-answer').value);$('#practice-next').onclick=()=>{pIndex++;checked=false;renderPractice(l,x)}}
function questionName(l,id){const key=id.slice(l.id.length+1);const q=key==='qcm'?l.qcm:key==='vf'?l.tf:key==='open'?l.open:key==='exam'?l.exam:null;return key==='recall'?'Rappel de mémoire':q?(q.q||'Question'):'Question de révision'}
function dueDate(s,id){const x=ensure(s,id);return x.due||'non programmée'}
function tick(){if(document.visibilityState==='visible'&&subject){data.seconds=(data.seconds||0)+1;data.timeBySubject[subject]=(data.timeBySubject[subject]||0)+1;if(data.seconds%15===0)save()}}
setInterval(tick,1000);window.addEventListener('pagehide',save);window.addEventListener('beforeunload',save);
